<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة المتجر | تيسير الأغا</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17283d;font:16px/1.6 system-ui,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.wrap{width:min(1050px,calc(100% - 30px));margin:28px auto}.panel{background:white;border:1px solid #e4e9ef;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px #10243b0c}.header{background:#102238;color:#fff;padding:14px 0}.header .wrap{display:flex;justify-content:space-between;align-items:center;margin:0 auto}.btn{border:0;border-radius:9px;background:#102238;color:#fff;padding:10px 15px;font-weight:750;cursor:pointer}.gold{background:#e7b64f;color:#102238}.muted{color:#718096}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:5px}input,textarea{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:8px}textarea{min-height:75px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:start;padding:11px;border-bottom:1px solid #e7ebf0}.scroll{overflow:auto}.danger{background:#b83c4c}.hidden{display:none!important}.status{margin:10px 0;padding:10px;border-radius:8px;background:#fff4d8}.actions{display:flex;gap:8px}.language{background:transparent;color:white;border:1px solid #ffffff70;border-radius:8px;padding:8px 12px;cursor:pointer}
    @media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.header .wrap{gap:8px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="header"><div class="wrap"><strong data-i="title">إدارة متجر تيسير الأغا</strong><div><button class="language" id="lang">English</button> <button class="language" id="logout" hidden data-i="logout">تسجيل الخروج</button></div></div></header>
  <main class="wrap">
    <section class="panel" id="loginPanel"><h1 data-i="loginTitle">دخول المدير</h1><p class="muted" data-i="loginText">استخدم حساب المدير الذي أنشأته في Supabase Authentication.</p><form id="loginForm"><label for="email" data-i="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password" data-i="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><p class="status" id="loginStatus" hidden></p><button class="btn gold" type="submit" data-i="signIn">دخول</button></form></section>
    <section id="adminPanel" class="hidden">
      <div class="panel"><h1 data-i="productsTitle">إدارة المنتجات</h1><p class="muted" data-i="secureNote">تتم حماية عمليات الإدارة بتسجيل الدخول وسياسات قاعدة البيانات.</p><p class="status" id="status" hidden></p></div>
      <div class="panel"><h2 data-i="addTitle">إضافة / تعديل منتج</h2><form class="form" id="productForm"><input id="productId" type="hidden"><div><label for="nameAr" data-i="nameAr">الاسم بالعربية</label><input id="nameAr" required></div><div><label for="nameEn" data-i="nameEn">الاسم بالإنجليزية</label><input id="nameEn" required></div><div class="full"><label for="descAr" data-i="descAr">الوصف بالعربية</label><textarea id="descAr"></textarea></div><div class="full"><label for="descEn" data-i="descEn">الوصف بالإنجليزية</label><textarea id="descEn"></textarea></div><div><label for="category" data-i="category">الفئة</label><input id="category"></div><div><label for="price" data-i="price">السعر</label><input id="price" type="number" min="0" step="0.01" required></div><div><label for="stock" data-i="stock">الكمية بالمخزون</label><input id="stock" type="number" min="0" step="1" value="0" required></div><div><label for="image" data-i="image">رابط الصورة (اختياري)</label><input id="image" type="url"></div><div class="full"><label><input id="active" type="checkbox" checked style="width:auto"> <span data-i="active">عرض المنتج في المتجر</span></label></div><div class="full actions"><button class="btn gold" type="submit" data-i="save">حفظ المنتج</button><button class="btn" id="cancelEdit" type="button" hidden data-i="cancel">إلغاء التعديل</button></div></form></div>
      <div class="panel"><h2 data-i="inventory">قائمة المنتجات</h2><div class="scroll"><table><thead><tr><th data-i="nameAr">الاسم بالعربية</th><th data-i="price">السعر</th><th data-i="stock">المخزون</th><th data-i="visibility">الحالة</th><th data-i="actions">الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script>
  <script>
    const text={ar:{title:'إدارة متجر تيسير الأغا',logout:'تسجيل الخروج',loginTitle:'دخول المدير',loginText:'استخدم حساب المدير الذي أنشأته في Supabase Authentication.',email:'البريد الإلكتروني',password:'كلمة المرور',signIn:'دخول',productsTitle:'إدارة المنتجات',secureNote:'تتم حماية عمليات الإدارة بتسجيل الدخول وسياسات قاعدة البيانات.',addTitle:'إضافة / تعديل منتج',nameAr:'الاسم بالعربية',nameEn:'الاسم بالإنجليزية',descAr:'الوصف بالعربية',descEn:'الوصف بالإنجليزية',category:'الفئة',price:'السعر',stock:'الكمية بالمخزون',image:'رابط الصورة (اختياري)',active:'عرض المنتج في المتجر',save:'حفظ المنتج',cancel:'إلغاء التعديل',inventory:'قائمة المنتجات',visibility:'الحالة',actions:'الإجراءات',shown:'معروض',hidden:'مخفي',edit:'تعديل',delete:'حذف',badConfig:'أضف إعدادات Supabase في js/supabase-config.js أولًا.',notAdmin:'هذا الحساب لا يملك صلاحية مدير. امنحه role=admin في public.profiles.',saved:'تم حفظ المنتج.',deleted:'تم حذف المنتج.',failed:'تعذر تنفيذ العملية. تحقق من الاتصال وسياسات RLS.',confirm:'هل تريد حذف هذا المنتج؟'},en:{title:'Tayseer Al Aga Store Admin',logout:'Log out',loginTitle:'Admin sign in',loginText:'Use the admin account created in Supabase Authentication.',email:'Email',password:'Password',signIn:'Sign in',productsTitle:'Product management',secureNote:'Admin operations are protected by authentication and database policies.',addTitle:'Add / edit product',nameAr:'Name in Arabic',nameEn:'Name in English',descAr:'Description in Arabic',descEn:'Description in English',category:'Category',price:'Price',stock:'Stock quantity',image:'Image URL (optional)',active:'Show product in store',save:'Save product',cancel:'Cancel edit',inventory:'Products',visibility:'Status',actions:'Actions',shown:'Visible',hidden:'Hidden',edit:'Edit',delete:'Delete',badConfig:'Add Supabase settings in js/supabase-config.js first.',notAdmin:'This account is not an admin. Set role=admin in public.profiles.',saved:'Product saved.',deleted:'Product deleted.',failed:'Operation failed. Check connection and RLS policies.',confirm:'Delete this product?'}};
    let lang='ar',client=null,products=[];const $=s=>document.querySelector(s);const tr=k=>text[lang][k]||k;
    function msg(el,key){el.textContent=tr(key);el.hidden=false}
    function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));$('#lang').textContent=l==='ar'?'English':'العربية';render()}
    function ready(){return window.supabase?.createClient&&window.SUPABASE_URL&&!window.SUPABASE_URL.includes('YOUR_PROJECT_ID')&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')}
    async function verifySession(){if(!ready()){msg($('#loginStatus'),'badConfig');return}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{session}}=await client.auth.getSession();if(session)await showAdmin(session.user)}
    async function showAdmin(user){const {data,error}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error||data?.role!=='admin'){await client.auth.signOut();msg($('#loginStatus'),'notAdmin');return}$('#loginPanel').classList.add('hidden');$('#adminPanel').classList.remove('hidden');$('#logout').hidden=false;await load()}
    async function load(){const {data,error}=await client.from('products').select('*').order('created_at',{ascending:false});if(error){msg($('#status'),'failed');return}products=data||[];render()}
    function render(){if(!$('#rows'))return;$('#rows').innerHTML=products.map(p=>`<tr><td>${esc(p.name_ar)}</td><td>${Number(p.price).toFixed(2)}</td><td>${p.stock}</td><td>${p.active?tr('shown'):tr('hidden')}</td><td class="actions"><button class="btn" data-edit="${p.id}">${tr('edit')}</button><button class="btn danger" data-delete="${p.id}">${tr('delete')}</button></td></tr>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function edit(id){const p=products.find(x=>x.id===id);if(!p)return;$('#productId').value=p.id;$('#nameAr').value=p.name_ar;$('#nameEn').value=p.name_en;$('#descAr').value=p.description_ar||'';$('#descEn').value=p.description_en||'';$('#category').value=p.category||'';$('#price').value=p.price;$('#stock').value=p.stock;$('#image').value=p.image_url||'';$('#active').checked=p.active;$('#cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
    function reset(){ $('#productForm').reset();$('#productId').value='';$('#active').checked=true;$('#cancelEdit').hidden=true }
    async function remove(id){if(!confirm(tr('confirm')))return;const {error}=await client.from('products').delete().eq('id',id);if(error){msg($('#status'),'failed');return}msg($('#status'),'deleted');await load()}
    $('#lang').onclick=()=>setLang(lang==='ar'?'en':'ar');$('#loginForm').onsubmit=async e=>{e.preventDefault();if(!ready()){msg($('#loginStatus'),'badConfig');return}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data,error}=await client.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginStatus').textContent=error.message;$('#loginStatus').hidden=false;return}await showAdmin(data.user)};
    $('#productForm').onsubmit=async e=>{e.preventDefault();const p={name_ar:$('#nameAr').value.trim(),name_en:$('#nameEn').value.trim(),description_ar:$('#descAr').value.trim(),description_en:$('#descEn').value.trim(),category:$('#category').value.trim(),price:Number($('#price').value),stock:Number($('#stock').value),image_url:$('#image').value.trim()||null,active:$('#active').checked};const id=$('#productId').value;const result=id?await client.from('products').update(p).eq('id',id):await client.from('products').insert(p);if(result.error){msg($('#status'),'failed');return}reset();msg($('#status'),'saved');await load()};
    $('#cancelEdit').onclick=reset;$('#logout').onclick=async()=>{if(client)await client.auth.signOut();$('#adminPanel').classList.add('hidden');$('#loginPanel').classList.remove('hidden');$('#logout').hidden=true};setLang('ar');verifySession();
  </script>
</body>
</html>
